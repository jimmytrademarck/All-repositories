<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Cartas náuticas</title>
<meta name="description" content="Cartas náuticas con profundidades, balizas y faros que funcionan sin conexión: GPS con velocidad y rumbo, rutas, marcas de pesca, medir distancias, grabar el rastro y previsión de viento y olas.">
<meta name="theme-color" content="#E2E5E1" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#131716" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Cartas">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<style>
/* Layout: la carta ocupa toda la pantalla. Arriba, la posición de la cruz y los botones de capas y menú;
   a la derecha, zoom y GPS; abajo, las herramientas (ruta, marca, medir, rastro, descargar).
   Los paneles salen a la derecha en el iPad y desde abajo en pantallas estrechas.
   Mismos colores, letras y botones que el resto de apps del taller; la velocidad y el rumbo, en pantalla LCD. */
:root{
  --bg:#E2E5E1; --surface:#F7F8F5; --sunk:#ECEFEA; --ink:#1A1F21; --muted:#56605B;
  --line:#C3C9C3; --line-strong:#98A19B;
  --accent:#F2B705; --accent-ink:#1A170A; --hl:rgba(242,183,5,.16);
  --ok:#17703F; --ko:#B3261E; --wa:#8F5400; --wa-bg:#F7E6C1;
  --lcd-frame:#2B302D; --lcd-bg:#B5C1A1; --lcd-ink:#172010; --lcd-dim:#4F5D3C;
  --shadow:0 2px 10px rgba(20,25,22,.22);
  --f-display:"Avenir Next Condensed","Roboto Condensed","Arial Narrow",sans-serif-condensed,system-ui,sans-serif;
  --f-body:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",sans-serif;
  --f-mono:ui-monospace,"SF Mono",Menlo,Consolas,"Roboto Mono",monospace;
  --st:env(safe-area-inset-top,0px); --sb:env(safe-area-inset-bottom,0px);
  --sl:env(safe-area-inset-left,0px); --sr:env(safe-area-inset-right,0px);
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not(.night){
    --bg:#131716; --surface:#1C2120; --sunk:#171B1A; --ink:#E4E8E4; --muted:#9BA59F;
    --line:#2F3734; --line-strong:#4C5651; --hl:rgba(242,183,5,.13);
    --ok:#3FBF73; --ko:#FF6B5E; --wa:#FFB340; --wa-bg:#3A2C0E;
    --lcd-frame:#070908; --lcd-bg:#0F1B12; --lcd-ink:#B6EE8A; --lcd-dim:#6E9358;
    --shadow:0 2px 12px rgba(0,0,0,.5);
    color-scheme:dark;
  }
}
/* Modo noche: todo oscuro y en tonos rojos para no deslumbrar en el barco */
:root.night{
  --bg:#120A09; --surface:#1A0F0D; --sunk:#140B0A; --ink:#FF8F7A; --muted:#C0614F;
  --line:#3A1E19; --line-strong:#5C2C24; --hl:rgba(255,120,90,.14);
  --accent:#B8432E; --accent-ink:#1A0806; --ok:#E0806A; --ko:#FF5A47; --wa:#E09A6A; --wa-bg:#2A140F;
  --lcd-frame:#070303; --lcd-bg:#1A0706; --lcd-ink:#FF6B55; --lcd-dim:#9A3A2C;
  --shadow:0 2px 12px rgba(0,0,0,.6);
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0;overflow:hidden;overscroll-behavior:none}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{background:#C9D8E0;color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.4;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
input,textarea,select{-webkit-user-select:text;user-select:text;font:inherit;color:inherit}
button,input,select,label{touch-action:manipulation}
button{font:inherit;color:inherit}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
#map{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab}
#map.drag{cursor:grabbing}
:root.night #map{filter:brightness(.42) sepia(.5) saturate(1.6) hue-rotate(-18deg)}
.ic{width:24px;height:24px;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

/* Barra de arriba */
.top{position:fixed;z-index:10;top:calc(var(--st) + 10px);left:calc(var(--sl) + 10px);right:calc(var(--sr) + 10px);display:flex;gap:8px;align-items:center;pointer-events:none}
.top>*{pointer-events:auto}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow)}
.brand{height:48px;display:flex;align-items:center;gap:9px;padding:0 14px 0 8px;font-family:var(--f-display);font-weight:700;font-size:1.3rem;line-height:1}
.brand img{width:32px;height:32px;border-radius:8px}
.coords{height:48px;padding:0 12px;display:flex;flex-direction:column;justify-content:center;align-items:flex-start;cursor:pointer;text-align:left;font-family:var(--f-mono);font-size:.9rem;line-height:1.2;font-variant-numeric:tabular-nums;white-space:nowrap;min-width:0}
.coords small{font-family:var(--f-body);font-size:.66rem;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.offline{height:30px;padding:0 10px;display:flex;align-items:center;border-radius:999px;background:var(--wa-bg);color:var(--wa);border:1px solid currentColor;font-weight:600;font-size:.8rem;white-space:nowrap}
.sp{flex:1 1 auto;min-width:0}
.ib{width:48px;height:48px;display:grid;place-items:center;cursor:pointer;padding:0;flex:none}
.ib.on{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.ib.gps-on{color:#0A66C2}
:root.night .ib.gps-on{color:var(--ink)}
.ib.gps-on.on{color:var(--surface)}
@media (max-width:620px){.brand span{display:none}.brand{padding:0 8px}.coords{font-size:.8rem;padding:0 10px}.coords small{display:none}.coords #coordsV span{display:block}}
@media (max-width:420px){.brand{display:none}}

/* Botones a la derecha */
.fabs{position:fixed;z-index:10;right:calc(var(--sr) + 10px);top:50%;transform:translateY(-50%);display:grid;gap:8px;transition:right .2s}
body.sheet-wide .fabs{right:calc(var(--sr) + 432px)}
.fab-group{display:grid;overflow:hidden}
.fab-group .ib{border-radius:0;border:0;box-shadow:none;background:transparent}
.fab-group .ib+.ib{border-top:1px solid var(--line)}

/* Herramientas abajo */
.tools{position:fixed;z-index:10;left:50%;transform:translateX(-50%);bottom:calc(var(--sb) + 10px);display:flex;gap:2px;padding:4px;border-radius:14px;max-width:calc(100% - 20px)}
.tool{position:relative;min-width:66px;height:56px;padding:0 6px;border:0;border-radius:10px;background:transparent;color:var(--ink);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-family:var(--f-display);font-weight:600;font-size:.84rem;letter-spacing:.03em;cursor:pointer;white-space:nowrap}
.tool[aria-pressed="true"]{background:var(--ink);color:var(--surface)}
.tool .badge{position:absolute;top:3px;right:5px;min-width:9px;height:9px;border-radius:999px}
.tool.rec .badge{background:#D5372A;box-shadow:0 0 0 2px var(--surface);animation:blink 1.2s infinite}
.tool .pc{font-family:var(--f-mono);font-size:.74rem;font-weight:700}
@keyframes blink{50%{opacity:.25}}
@media (max-width:420px){.tool{min-width:0;flex:1 1 0;font-size:.74rem;padding:0 2px}.tools{left:10px;right:10px;transform:none;max-width:none}}

/* Barra del modo (ruta, medir, marca, descargar) */
.modebar{position:fixed;z-index:12;top:calc(var(--st) + 68px);left:50%;transform:translateX(-50%);width:max-content;max-width:calc(100% - 20px);background:var(--ink);color:var(--surface);border-radius:14px;padding:8px 8px 8px 14px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;justify-content:flex-end;box-shadow:var(--shadow)}
.modebar .txt{flex:1 1 220px;min-width:0;font-size:.95rem;line-height:1.3}
.modebar .txt b{font-family:var(--f-display);font-size:1.12rem}
.modebar .txt small{display:block;opacity:.75;font-size:.8rem}
.modebar .btns{display:flex;gap:6px;flex-wrap:wrap}
.modebar button,.modebar select{min-height:42px;padding:0 13px;border-radius:9px;border:0;background:rgba(255,255,255,.14);color:inherit;font-family:var(--f-display);font-weight:600;font-size:1.02rem;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
:root.night .modebar button, :root.night .modebar select{background:rgba(0,0,0,.25)}
.modebar select{appearance:none;-webkit-appearance:none;padding-right:28px;background-image:linear-gradient(45deg,transparent 50%,currentColor 50%),linear-gradient(135deg,currentColor 50%,transparent 50%);background-position:calc(100% - 15px) 50%,calc(100% - 10px) 50%;background-size:5px 5px;background-repeat:no-repeat}
.modebar select option{color:#1A1F21}
.modebar button.pri{background:var(--accent);color:var(--accent-ink)}
.modebar button:disabled{opacity:.4;cursor:default}
.prog{height:8px;border-radius:999px;background:rgba(255,255,255,.18);overflow:hidden;margin-top:6px}
.prog i{display:block;height:100%;background:var(--accent);width:0;transition:width .25s}

/* Escala y fuentes */
.scale{position:fixed;z-index:9;right:calc(var(--sr) + 12px);bottom:calc(var(--sb) + 80px);display:grid;justify-items:end;gap:2px;pointer-events:none;color:#1A1F21}
.scale .bar{height:7px;border:2px solid #1A1F21;border-top:0;background:rgba(255,255,255,.55);box-shadow:0 0 0 1px rgba(255,255,255,.6)}
.scale .lbl{font-family:var(--f-mono);font-size:.78rem;font-weight:700;text-shadow:0 0 3px #fff,0 0 3px #fff}
.scale .src{font-size:.62rem;text-shadow:0 0 3px #fff,0 0 3px #fff;opacity:.85}
:root.night .scale{opacity:.6}

/* Pantalla LCD de navegación */
.navbox{position:fixed;z-index:10;left:calc(var(--sl) + 10px);bottom:calc(var(--sb) + 80px);background:var(--lcd-frame);border-radius:14px;padding:7px;display:grid;gap:6px;width:min(320px,calc(100% - 20px));box-shadow:var(--shadow)}
.lcd{background:var(--lcd-bg);color:var(--lcd-ink);border-radius:8px;padding:6px 10px 7px;display:grid;grid-template-columns:1fr 1fr;gap:1px 14px;font-family:var(--f-mono);font-variant-numeric:tabular-nums;box-shadow:inset 0 2px 5px rgba(0,0,0,.22)}
.lcd .k{display:block;font-family:var(--f-body);font-size:.64rem;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--lcd-dim)}
.lcd .v{display:block;font-size:1.65rem;font-weight:700;line-height:1.05;white-space:nowrap}
.lcd .v small{font-size:.8rem;font-weight:600;margin-left:3px}
.lcd .full{grid-column:1/-1}
.lcd .pos{font-size:.95rem;font-weight:600;white-space:nowrap}
.lcd .sub{font-size:.82rem;font-weight:600}
.lcd.stale{opacity:.55}
.nbtns{display:flex;gap:5px}
.nbtns button{flex:1 1 auto;min-height:38px;border-radius:8px;border:0;background:#3A403C;color:#E4E8E4;font-family:var(--f-display);font-weight:600;font-size:.95rem;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:5px;padding:0 8px}
:root.night .nbtns button{background:#2A100C;color:var(--ink)}
.nbtns .ic{width:18px;height:18px}

/* Tarjeta de información de un punto */
.pop{position:fixed;z-index:15;left:50%;transform:translateX(-50%);bottom:calc(var(--sb) + 80px);width:min(460px,calc(100% - 20px));padding:12px 12px 12px 16px;display:grid;gap:8px}
.pop-h{display:flex;gap:10px;align-items:flex-start}
.pop-h .t{flex:1 1 auto;min-width:0}
.pop-h b{display:block;font-family:var(--f-display);font-size:1.3rem;line-height:1.1}
.pop-h small{display:block;color:var(--muted);font-size:.84rem}
.pop .mono{font-family:var(--f-mono);font-size:.92rem;font-variant-numeric:tabular-nums}
.pop .note{color:var(--muted);font-size:.92rem;white-space:pre-wrap}
.pop .x{width:40px;height:40px;border-radius:10px;border:1px solid var(--line);background:transparent;display:grid;place-items:center;cursor:pointer;flex:none}

/* Botones */
.acts{display:flex;flex-wrap:wrap;gap:6px}
.sbtn{min-height:42px;padding:0 13px;border-radius:9px;border:1px solid var(--line-strong);background:transparent;color:var(--ink);font-family:var(--f-display);font-weight:600;font-size:1.02rem;display:inline-flex;align-items:center;justify-content:center;gap:6px;cursor:pointer;text-decoration:none;white-space:nowrap}
.sbtn .ic{width:19px;height:19px}
.sbtn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.sbtn.dark{background:var(--ink);border-color:var(--ink);color:var(--surface)}
.sbtn.ko{color:var(--ko);border-color:currentColor}
.sbtn.wide{flex:1 1 auto}
.sbtn:disabled{opacity:.4;cursor:default}

/* Panel lateral */
.sheet{position:fixed;z-index:20;display:flex;flex-direction:column;overflow:hidden;background:var(--surface);border:1px solid var(--line);box-shadow:0 10px 34px rgba(0,0,0,.3)}
@media (min-width:820px){.sheet{top:calc(var(--st) + 68px);right:calc(var(--sr) + 10px);bottom:calc(var(--sb) + 10px);width:412px;border-radius:16px}}
@media (max-width:819px){.sheet{left:0;right:0;bottom:0;max-height:min(78vh,calc(100% - var(--st) - 70px));border-radius:18px 18px 0 0;border-bottom:0;padding-bottom:var(--sb)}}
.sheet-h{display:flex;gap:8px;align-items:flex-start;padding:10px 10px 8px}
.stabs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:3px;flex:1 1 auto;min-width:0;background:var(--sunk);border:1px solid var(--line);border-radius:12px;padding:4px}
@media (min-width:560px) and (max-width:819px){.stabs{grid-template-columns:repeat(6,minmax(0,1fr))}}
.stab{min-height:40px;padding:6px 4px;overflow:hidden;text-overflow:ellipsis;border:0;border-radius:8px;background:transparent;color:var(--ink);font-family:var(--f-display);font-weight:600;font-size:1.02rem;cursor:pointer;white-space:nowrap}
.stab[aria-selected="true"]{background:var(--ink);color:var(--surface)}
.sheet-b{overflow:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;padding:6px 14px 22px;display:grid;gap:18px;align-content:start}
.sec{display:grid;gap:9px;min-width:0}
.lbl{margin:0;font-family:var(--f-display);font-weight:600;font-size:.8rem;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);display:flex;gap:10px;align-items:baseline;justify-content:space-between}
.hint{margin:0;font-size:.87rem;color:var(--muted)}
.hint.warn{color:var(--wa);background:var(--wa-bg);border-radius:10px;padding:10px 12px}
h2{margin:0;font-family:var(--f-display);font-weight:700;font-size:1.6rem;line-height:1.05}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{display:inline-flex;flex-direction:column;align-items:flex-start;justify-content:center;min-height:46px;padding:7px 12px;border:1px solid var(--line-strong);background:transparent;color:var(--ink);border-radius:8px;font:inherit;font-weight:500;cursor:pointer;text-align:left;line-height:1.15;flex:1 1 auto}
.seg button b{font-family:var(--f-display);font-weight:600;font-size:1.06rem}
.seg button small{font-size:.74rem;color:var(--muted);font-weight:400;margin-top:2px}
.seg button[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--surface)}
.seg button[aria-pressed="true"] small{color:inherit;opacity:.75}
.seg.emo button{flex:0 0 auto;align-items:center;min-width:62px}
.seg.emo button span{font-size:1.35rem;line-height:1}
.row{display:flex;gap:12px;align-items:center;justify-content:space-between;min-height:46px;padding:4px 0;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.row .t{min-width:0}
.row .t b{display:block;font-weight:600}
.row .t small{display:block;color:var(--muted);font-size:.82rem}
.sw{appearance:none;-webkit-appearance:none;width:52px;height:32px;border-radius:999px;background:var(--line-strong);position:relative;cursor:pointer;flex:none;transition:background .15s;margin:0}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:26px;height:26px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.3);transition:transform .15s}
.sw:checked{background:var(--ok)}
.sw:checked::after{transform:translateX(20px)}
input[type=range]{width:100%;accent-color:var(--accent);margin:0;height:32px}
.field{display:grid;gap:5px}
.field>span{font-size:.84rem;font-weight:600;color:var(--muted)}
.inp{width:100%;min-height:46px;padding:9px 12px;border:1px solid var(--line-strong);border-radius:9px;background:var(--bg);color:var(--ink);font-size:16px}
textarea.inp{min-height:84px;resize:vertical}
.inp.mono{font-family:var(--f-mono);font-size:15px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.empty{padding:16px;border:1px dashed var(--line-strong);border-radius:12px;color:var(--muted);text-align:center;font-size:.92rem}

/* Listas */
.list{display:grid;gap:8px}
.item{display:grid;gap:8px;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:var(--bg)}
.item-h{display:flex;gap:10px;align-items:center}
.item-h .em{font-size:1.5rem;width:34px;height:34px;display:grid;place-items:center;border-radius:50%;background:var(--surface);border:2px solid var(--c,var(--line-strong));flex:none;line-height:1}
.item-h .t{flex:1 1 auto;min-width:0}
.item-h .t b{display:block;font-weight:700;font-size:1.02rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item-h .t small{display:block;color:var(--muted);font-size:.82rem;font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.item .acts .sbtn{min-height:38px;padding:0 10px;font-size:.96rem}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:.78rem;font-weight:600;padding:2px 8px;border-radius:999px;background:var(--sunk);border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.chip.ok{color:var(--ok);border-color:currentColor}
.chip.wa{color:var(--wa);border-color:currentColor;background:var(--wa-bg)}
table.legs{width:100%;border-collapse:collapse;font-size:.88rem;font-variant-numeric:tabular-nums}
table.legs th{text-align:left;font-weight:600;color:var(--muted);font-size:.74rem;letter-spacing:.06em;text-transform:uppercase;padding:4px 4px;border-bottom:1px solid var(--line)}
table.legs td{padding:5px 4px;border-bottom:1px solid var(--line);font-family:var(--f-mono);white-space:nowrap}
table.legs td:first-child{font-family:var(--f-body);white-space:normal}
.stat{display:grid;grid-template-columns:repeat(auto-fit,minmax(90px,1fr));gap:6px}
.stat div{background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:6px 9px}
.stat small{display:block;font-size:.66rem;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);font-weight:600}
.stat b{font-family:var(--f-mono);font-size:1.02rem}

/* Ventanas */
.modal{position:fixed;inset:0;z-index:30;background:rgba(10,14,12,.45);display:grid;place-items:center;padding:calc(var(--st) + 12px) 12px calc(var(--sb) + 12px)}
.mcard{width:min(520px,100%);max-height:100%;display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:0 16px 44px rgba(0,0,0,.35);overflow:hidden}
.m-h{display:flex;align-items:center;gap:10px;padding:14px 12px 6px 18px}
.m-h h2{flex:1 1 auto}
.m-b{overflow:auto;-webkit-overflow-scrolling:touch;padding:8px 18px 14px;display:grid;gap:14px}
.m-f{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end;padding:10px 14px 14px;border-top:1px solid var(--line)}
.m-f .sbtn{flex:1 1 auto}
.res{display:grid;gap:6px}
.res button{display:flex;gap:10px;align-items:center;text-align:left;width:100%;min-height:48px;padding:8px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);cursor:pointer}
.res button b{display:block;font-weight:600}
.res button small{display:block;color:var(--muted);font-size:.8rem}
.fc{width:100%;border-collapse:collapse;font-size:.88rem;font-variant-numeric:tabular-nums}
.fc th{position:sticky;top:0;background:var(--surface);text-align:left;font-weight:600;color:var(--muted);font-size:.7rem;letter-spacing:.06em;text-transform:uppercase;padding:5px 4px;border-bottom:1px solid var(--line-strong)}
.fc td{padding:6px 4px;border-bottom:1px solid var(--line);white-space:nowrap}
.fc td.d{font-weight:700;font-family:var(--f-display);font-size:1rem;padding-top:12px;border-bottom:1px solid var(--line-strong)}

(function () {
  if (location.protocol !== 'https:' && location.hostname !== 'localhost' && location.hostname !== '127.0.0.1') return;
  function note(text, bg, ms) {
    function show() {
      var d = document.createElement('div');
      d.setAttribute('role', 'status');
      d.textContent = text;
      d.style.cssText = 'position:fixed;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom,0px));z-index:2147483647;background:' + bg + ';color:#FFFFFF;font:600 16px/1.35 system-ui,-apple-system,sans-serif;padding:12px 18px;border-radius:16px;box-shadow:0 6px 20px rgba(0,0,0,.28);pointer-events:none;width:max-content;max-width:calc(100% - 32px);text-align:center';
      document.body.appendChild(d);
      setTimeout(function () { d.remove(); }, ms);
    }
    if (document.body) show(); else document.addEventListener('DOMContentLoaded', show);
  }
  var NO = 'Safari no deja guardar esta app para usarla sin conexión. Si estás en navegación privada, sal de ella, borra el icono y vuelve a añadirlo a la pantalla de inicio.';
  if (!('serviceWorker' in navigator)) { note(NO, '#B3261E', 12000); return; }

  navigator.serviceWorker.register('./sw.js').then(function () { return navigator.serviceWorker.ready; }).then(function () {
    var seen = null;

})();

<script>
(function () {
'use strict';
window.APPV = '2026-11-22 16:58';

/* ======================= Utilidades ======================= */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const rad = d => d * Math.PI / 180, deg = r => r * 180 / Math.PI;
const NM = 1852, RE = 6371008.8;
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'}[c]));
const nf = (v, d = 1) => Number(v).toLocaleString('es-ES', {minimumFractionDigits: d, maximumFractionDigits: d});
const ni = v => Math.round(v).toLocaleString('es-ES', {useGrouping: true});
const pad = (n, l) => String(n).padStart(l, '0');
const sleep = ms => new Promise(r => setTimeout(r, ms));
const norm = s => String(s).normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase();
const ic = id => '<svg class="ic"><use href="#i-' + id + '"/></svg>';
const FONT = '-apple-system,system-ui,"Segoe UI",Roboto,sans-serif';
const EMOJI = '"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif';
const ROUTE = '#C2187A', TRACK = '#E06A00', RECC = '#D5372A', BOAT = '#0A66C2';

let toastEl = null, toastT = 0;
function toast(text, kind, ms) {
  if (toastEl) toastEl.remove();
  const d = document.createElement('div');
  d.className = 'toast';
  d.setAttribute('role', 'status');
  d.style.background = kind === 'ko' ? '#B3261E' : kind === 'wa' ? '#8F5400' : kind === 'info' ? '#2B302D' : '#17703F';
  d.textContent = text;
  document.body.appendChild(d);
  toastEl = d;
  clearTimeout(toastT);
  toastT = setTimeout(() => { d.remove(); if (toastEl === d) toastEl = null; }, ms || 3500);
}

/* ======================= Registro de errores ======================= */
const ERRS = (() => { try { return JSON.parse(localStorage.getItem('cn:errs') || '[]'); } catch (e) { return []; } })();
function logErr(m) {
  try {
    ERRS.push(new Date().toLocaleString('es-ES') + ' · ' + String(m).slice(0, 300));
    while (ERRS.length > 20) ERRS.shift();
    localStorage.setItem('cn:errs', JSON.stringify(ERRS));
  } catch (e) { /* nada */ }
}
window.addEventListener('error', e => logErr((e.message || 'Error') + (e.filename ? ' @' + String(e.filename).split('/').pop() + ':' + e.lineno : '')));
window.addEventListener('unhandledrejection', e => logErr('Promesa: ' + (e.reason && (e.reason.message || e.reason) || 'sin motivo')));

/* ======================= Guardado (IndexedDB, con localStorage de reserva) ======================= */
const DB = (() => {
  let dbp = null;
  function open() {
    if (!dbp) dbp = new Promise((res, rej) => {
      const r = indexedDB.open('cartas-nauticas', 1);
      r.onupgradeneeded = () => r.result.createObjectStore('kv');
      r.onsuccess = () => res(r.result);
      r.onerror = () => rej(r.error);
    });
    return dbp;
  }
  async function get(k) {
    try {
      const db = await open();
      return await new Promise((res, rej) => {
        const q = db.transaction('kv').objectStore('kv').get(k);
        q.onsuccess = () => res(q.result);
        q.onerror = () => rej(q.error);
      });
    } catch (e) {
      try { const v = localStorage.getItem('cn:' + k); return v ? JSON.parse(v) : undefined; } catch (e2) { return undefined; }
    }
  }
  async function set(k, v) {
    try {
      const db = await open();
      await new Promise((res, rej) => {
        const tx = db.transaction('kv', 'readwrite');
        tx.objectStore('kv').put(v, k);
        tx.oncomplete = res;
        tx.onerror = () => rej(tx.error);
      });
    } catch (e) {
      try { localStorage.setItem('cn:' + k, JSON.stringify(v)); } catch (e2) { toast('No se pudo guardar en este iPad', 'ko'); }
    }
  }
  return {get, set};
})();

/* ======================= Estado ======================= */
const DEF = {
  base: 'ihmw', sea: false, seaOp: 1, depth: false, depthOp: 0.55, sond: true, sondOp: 1, cab: false, v: 3, ihmMode: '',
  showMarks: true, showRoutes: true, showTracks: true,
  coord: 'ddm', mag: false, decl: 0, cruise: 6, arrive: 100 / 1852,
  legLabels: true, cross: true, wake: true, night: false, warned: false, draft: 1.5, margin: 1
};
const S = {
  set: Object.assign({}, DEF), marks: [], routes: [], tracks: [], areas: [],
  nav: null, rec: null, mode: null, editRoute: null, measure: [], pin: null, sel: null,
  tab: 'capas', dlZ: 14, legsOpen: null, popCtx: null,
  gps: {on: false, follow: false, watch: null, fix: null, sog: null, cog: null, hist: [], first: true}
};
const saveT = {};
function stateOf(k) {
  if (k === 'set') return S.set;
  if (k === 'view') { const c = centerLL(); return {lat: c.lat, lon: c.lon, z: M.z}; }
  return S[k];
}
function save(k, ms) {
  clearTimeout(saveT[k]);
  saveT[k] = setTimeout(() => { delete saveT[k]; DB.set(k, stateOf(k)); }, ms == null ? 250 : ms);
}
function flush() {
  Object.keys(saveT).forEach(k => { clearTimeout(saveT[k]); delete saveT[k]; DB.set(k, stateOf(k)); });
  if (S.rec) DB.set('rec', S.rec);
}

/* ======================= Navegación: cálculos ======================= */
function rhumb(a, b) {
  const p1 = rad(a.lat), p2 = rad(b.lat);
  let dl = rad(b.lon - a.lon);
  if (Math.abs(dl) > Math.PI) dl = dl > 0 ? -(2 * Math.PI - dl) : (2 * Math.PI + dl);
  const dp = p2 - p1;
  const dpsi = Math.log(Math.tan(Math.PI / 4 + p2 / 2) / Math.tan(Math.PI / 4 + p1 / 2));
  const q = Math.abs(dpsi) > 1e-12 ? dp / dpsi : Math.cos(p1);
  const m = Math.sqrt(dp * dp + q * q * dl * dl) * RE;
  const brg = (deg(Math.atan2(dl, dpsi)) + 360) % 360;
  return {m, nm: m / NM, brg};
}
/* Distancia al rumbo del tramo, en metros: positiva si el barco va a babor (izquierda) de la línea */
function xte(a, b, p) {
  const k = Math.cos(rad(a.lat)) * 111320, ky = 110574;
  const bx = (b.lon - a.lon) * k, by = (b.lat - a.lat) * ky;
  const px = (p.lon - a.lon) * k, py = (p.lat - a.lat) * ky;
  const L = Math.hypot(bx, by);
  return L < 1 ? 0 : (bx * py - by * px) / L;
}
function routeNm(r) { let s = 0; for (let i = 1; i < r.pts.length; i++) s += rhumb(r.pts[i - 1], r.pts[i]).nm; return s; }
function pathNm(pts) { let s = 0; for (let i = 1; i < pts.length; i++) s += rhumb({lat: pts[i - 1][0], lon: pts[i - 1][1]}, {lat: pts[i][0], lon: pts[i][1]}).nm; return s; }

/* ======================= Formatos ======================= */
function fmtC(v, h, dg) {
  const a = Math.abs(v), f = S.set.coord;
  if (f === 'dd') return nf(a, 5) + '° ' + h;
  let d = Math.floor(a), m = (a - d) * 60;
  if (f === 'dms') {
    let mi = Math.floor(m), s = Math.round((m - mi) * 600) / 10;
    if (s >= 60) { s = 0; mi++; }
    if (mi >= 60) { mi = 0; d++; }
    return pad(d, dg) + '° ' + pad(mi, 2) + '′ ' + nf(s, 1).padStart(4, '0') + '″ ' + h;
  }
  m = Math.round(m * 1000) / 1000;
  if (m >= 60) { m = 0; d++; }
  return pad(d, dg) + '° ' + nf(m, 3).padStart(6, '0') + '′ ' + h;
}
const fmtLat = lat => fmtC(lat, lat < 0 ? 'S' : 'N', 2);
const fmtLon = lon => fmtC(lon, lon < 0 ? 'W' : 'E', 3);
const fmtLL = p => fmtLat(p.lat) + '  ' + fmtLon(p.lon);
function fmtDist(nm) {
  if (nm == null || !isFinite(nm)) return '—';
  if (nm < 0.1) return ni(nm * NM) + ' m';
  if (nm < 10) return nf(nm, 2) + ' M';
  if (nm < 100) return nf(nm, 1) + ' M';
  return ni(nm) + ' M';
}
function brgOut(b) { if (S.set.mag) b -= S.set.decl; return ((Math.round(b) % 360) + 360) % 360; }
function fmtBrg(b) { return (b == null || !isFinite(b)) ? '—' : pad(brgOut(b), 3) + '°'; }
function fmtDur(h) {
  if (h == null || !isFinite(h)) return '—';
  const mins = Math.round(h * 60);
  if (mins < 60) return mins + ' min';
  const hh = Math.floor(mins / 60), mm = mins % 60;
  return hh + ' h' + (mm ? ' ' + pad(mm, 2) + ' min' : '');
}
function fmtDate(t) {
  const d = new Date(t);
  return d.toLocaleDateString('es-ES', {day: '2-digit', month: '2-digit', year: '2-digit'}) + ' ' + d.toLocaleTimeString('es-ES', {hour: '2-digit', minute: '2-digit'});
}
function fmtClock(ms) {
  const s = Math.floor(ms / 1000), h = Math.floor(s / 3600), m = Math.floor(s / 60) % 60;
  return h ? h + ':' + pad(m, 2) + ':' + pad(s % 60, 2) : pad(m, 2) + ':' + pad(s % 60, 2);
}

/* Lee coordenadas escritas de muchas formas: 36 31,234 N 6 17,456 W · 36.52, -6.29 · N36°31'14" W6°17'27" */
function parseCoords(str) {
  if (!str) return null;
  let s = String(str).toUpperCase().replace(/(\d),(\d)/g, '$1.$2')
    .replace(/OESTE|WEST/g, ' W ').replace(/NORTE|NORTH/g, ' N ').replace(/ESTE|EAST/g, ' E ').replace(/SUR|SOUTH/g, ' S ');
  if (!/\d/.test(s)) return null;
  if (/[A-DF-MPQRT-VX-Z]/.test(s.replace(/[NSEWO]/g, ''))) return null;
  const toks = s.match(/[NSEWO]|[-+]?\d+(?:\.\d+)?/g);
  if (!toks) return null;
  const groups = [];
  let cur = {n: [], h: null, pre: false}, pre = null;
  for (const t of toks) {
    if (/^[NSEWO]$/.test(t)) {
      if (cur.n.length) {
        if (cur.pre) { groups.push(cur); cur = {n: [], h: null, pre: false}; pre = t; }
        else { cur.h = t; groups.push(cur); cur = {n: [], h: null, pre: false}; }
      } else pre = t;
    } else {
      if (!cur.n.length && pre) { cur.h = pre; cur.pre = true; pre = null; }
      cur.n.push(parseFloat(t));
    }
  }
  if (cur.n.length) groups.push(cur);
  if (groups.length === 1) {
    const n = groups[0].n, k = n.length / 2;
    if (![1, 2, 3].includes(k)) return null;
    groups.splice(0, 1, {n: n.slice(0, k), h: null}, {n: n.slice(k), h: null});

/* ======================= Modos: ruta, marca, medir, descargar ======================= */
const DL = {running: false, paused: false, cancel: false, area: null, done: 0, total: 0, err: 0, bytes: 0};
const DLZMIN = 3, MAXT = 15000;
function setMode(m) {
  if (S.mode === 'route' && m !== 'route') finishRoute();
  if (S.mode === 'measure') S.measure = [];
  if (m === 'download' && DL.running) { m = null; openSheet('zonas'); }
  S.mode = m;
  if (m) { closeSheet(); closePop(); }
  if (m === 'route' && !S.routes.find(r => r.id === S.editRoute)) {
    const r = {id: uid(), name: 'Ruta ' + (S.routes.length + 1), pts: [], vis: true, date: Date.now()};
    S.routes.push(r); S.editRoute = r.id;
  }
  if (m === 'download' && S.set.base === 'osm') toast('El callejero no se puede descargar: se descargará la carta batimétrica', 'wa', 5000);
  $$('.tool[data-mode]').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.mode === S.mode)));
  $('#bQa').hidden = !!S.mode;
  renderModebar(); req();
}
function finishRoute() {
  const r = S.routes.find(q => q.id === S.editRoute);
  S.editRoute = null;
  if (!r) return;
  if (r.pts.length < 2) {
    S.routes = S.routes.filter(q => q !== r);
    if (r.pts.length) toast('Una ruta necesita al menos 2 puntos: no se ha guardado', 'wa');
  } else toast(r.name + ' guardada · ' + fmtDist(routeNm(r)));
  save('routes'); refreshSheet();
}
function editRoute(id) { if (S.mode === 'route') setMode(null); S.editRoute = id; setMode('route'); }
function renderModebar() {
  const mb = $('#modebar'), m = S.mode;
  if (!m) { mb.hidden = true; mb.innerHTML = ''; return; }
  mb.hidden = false;
  let b = '';
  if (m === 'route') b = '<button type="button" data-mb="undo">' + ic('undo') + 'Deshacer</button><button type="button" class="pri" data-mb="done">' + ic('check') + 'Terminar</button>';
  if (m === 'measure') b = '<button type="button" data-mb="undo">' + ic('undo') + 'Deshacer</button><button type="button" data-mb="clear">Borrar</button><button type="button" class="pri" data-mb="done">Salir</button>';
  if (m === 'mark') b = '<button type="button" data-mb="cross">En la cruz</button>' + (S.gps.fix ? '<button type="button" data-mb="here">En mi posición</button>' : '') + '<button type="button" data-mb="done">Cancelar</button>';
  if (m === 'download') {
    const zs = [[11, 'general'], [12, 'costa'], [13, 'costa con detalle'], [14, 'detalle'], [15, 'máximo de la carta'], [16, 'balizas de cerca'], [17, 'balizas muy de cerca']];
    b = '<select id="dlZ" aria-label="Detalle de la descarga">' + zs.map(z => '<option value="' + z[0] + '"' + (z[0] === S.dlZ ? ' selected' : '') + '>Hasta zoom ' + z[0] + ' (' + z[1] + ')</option>').join('') + '</select>' +
      '<button type="button" class="pri" data-mb="dlgo" id="dlGo">' + ic('dl') + 'Descargar</button><button type="button" data-mb="done">Cancelar</button>';
  }
  mb.innerHTML = '<div class="txt" id="mbT"></div><div class="btns">' + b + '</div>';
  const sel = $('#dlZ');
  if (sel) sel.onchange = () => { S.dlZ = +sel.value; updateModebar(); };
  updateModebar();
}
function dlLayers() {
  const l = S.set.base === 'ihmw' ? ['ihmw', 'ihmw5', 'emodlo'] : S.set.base === 'ihm' ? ['ihm', 'emodlo'] : ['emod'];
  if (S.set.sond && S.set.base !== 'ihmw') l.push('sond');
  if (S.set.cab) l.push('cab');
  if (S.set.sea) l.push('sea');
  if (S.set.depth) l.push('depth');
  return l;
}
function tileRange(b, z) {
  const n = 1 << z;
  return {
    x0: clamp(Math.floor(lon2x(b.w) * n), 0, n - 1), x1: clamp(Math.floor(lon2x(b.e) * n - 1e-9), 0, n - 1),
    y0: clamp(Math.floor(lat2y(b.n) * n), 0, n - 1), y1: clamp(Math.floor(lat2y(b.s) * n - 1e-9), 0, n - 1)
  };
}
function countTiles(b, zmin, zmax, layers) {
  let c = 0, kb = 0;
  layers.forEach(id => {
    const L = LAYERS[id];
    for (let z = Math.max(zmin, L.min); z <= Math.min(zmax, L.max); z++) {
      const r = tileRange(b, z), k = (r.x1 - r.x0 + 1) * (r.y1 - r.y0 + 1);
      c += k; kb += k * L.kb;
    }
  });
  return {n: c, mb: kb / 1024};
}
function updateModebar() {
  const t = $('#mbT');
  if (!t) return;
  const m = S.mode;
  if (m === 'route') {
    const r = S.routes.find(q => q.id === S.editRoute);
    if (!r) return;
    const nm = routeNm(r), n = r.pts.length;
    t.innerHTML = '<b>' + esc(r.name) + '</b> · ' + n + (n === 1 ? ' punto' : ' puntos') + (n > 1 ? ' · ' + fmtDist(nm) + ' · ' + fmtDur(nm / S.set.cruise) + ' a ' + nf(S.set.cruise, 0) + ' kn' : '') +
      '<small>Toca la carta para añadir puntos. Arrastra un punto para moverlo; tócalo para quitarlo.</small>';
    const u = $('[data-mb="undo"]'); if (u) u.disabled = !n;
  } else if (m === 'measure') {
    const ps = S.measure, n = ps.length;
    let s = 'Toca dos o más puntos en la carta.';
    if (n > 1) { const l = rhumb(ps[n - 2], ps[n - 1]); s = 'Último tramo ' + fmtDist(l.nm) + ' · ' + fmtBrg(l.brg); }
    t.innerHTML = '<b>Medir</b>' + (n > 1 ? ' · ' + fmtDist(pathNm(ps.map(p => [p.lat, p.lon]))) + ' · ' + fmtDur(pathNm(ps.map(p => [p.lat, p.lon])) / S.set.cruise) + ' a ' + nf(S.set.cruise, 0) + ' kn' : '') + '<small>' + s + '</small>';
    const u = $('[data-mb="undo"]'); if (u) u.disabled = !n;
  } else if (m === 'mark') {
    t.innerHTML = '<b>Marca nueva</b><small>Toca la carta donde quieres la marca.</small>';
  } else if (m === 'download') {
    const c = countTiles(dlBBox(), DLZMIN, S.dlZ, dlLayers());
    const big = c.n > MAXT, off = !navigator.onLine;
    const key = c.n + '|' + big + '|' + off;
    if (t.dataset.k === key) return;
    t.dataset.k = key;
    t.innerHTML = '<b>Descargar zona</b> · ' + ni(c.n) + ' cuadros · unos ' + (c.mb < 10 ? nf(c.mb, 1) : ni(c.mb)) + ' MB' +
      '<small>' + (off ? 'Necesitas internet para descargar.' : big ? 'Demasiado grande: acerca la carta o elige menos detalle.' : 'Mueve y amplía la carta hasta que la zona quede dentro del recuadro.') + '</small>';
    const g = $('#dlGo'); if (g) g.disabled = big || off || !c.n;
  }
}
$('#modebar').addEventListener('click', e => {

      const r = await fetch('https://nominatim.openstreetmap.org/search?format=jsonv2&limit=8&accept-language=es&q=' + encodeURIComponent(q.value.trim()));
      const j = await r.json();

}

/* --- Previsión de viento y olas (Open-Meteo) --- */
const CARD = ['N', 'NNE', 'NE', 'ENE', 'E', 'ESE', 'SE', 'SSE', 'S', 'SSO', 'SO', 'OSO', 'O', 'ONO', 'NO', 'NNO'];
const card = d => CARD[Math.round(((d % 360) + 360) % 360 / 22.5) % 16];
const BFT = [1, 4, 7, 11, 17, 22, 28, 34, 41, 48, 56, 64];
const BFTC = ['#7FB3D5', '#7FB3D5', '#5DADE2', '#48C9B0', '#52BE80', '#F4D03F', '#F5B041', '#EB984E', '#E74C3C', '#C0392B', '#922B21', '#6C3483', '#4A235A'];
const bft = kn => { let i = 0; while (i < BFT.length && kn >= BFT[i]) i++; return i; };
async function forecast(p) {
  closePop();
  openModal('Mar y viento', '<p class="hint">' + esc(fmtLL(p)) + '</p><div id="fcB"><p class="empty">Cargando la previsión…</p></div>');
  const box = () => $('#fcB');
  let saved = (await DB.get('fc')) || [];
  const near = saved.filter(s => rhumb(s, p).nm < 6).sort((a, b) => b.t - a.t)[0];
  if (!navigator.onLine) {
    if (near && box()) box().innerHTML = '<p class="hint warn">Sin internet. Previsión guardada el ' + fmtDate(near.t) + ' para un punto a ' + fmtDist(rhumb(near, p).nm) + '.</p>' + fcTable(near);
    else if (box()) box().innerHTML = '<p class="empty">Sin internet y sin previsión guardada para esta zona. Consúltala con internet antes de salir y se quedará guardada.</p>';
    return;
  }
  try {
    const qs = 'latitude=' + p.lat.toFixed(4) + '&longitude=' + p.lon.toFixed(4) + '&timezone=auto&forecast_days=3';
    const [w, m] = await Promise.allSettled([
      fetch('https://api.open-meteo.com/v1/forecast?' + qs + '&hourly=wind_speed_10m,wind_direction_10m,wind_gusts_10m&wind_speed_unit=kn').then(r => r.json()),
      fetch('https://marine-api.open-meteo.com/v1/marine?' + qs + '&hourly=wave_height,wave_direction,wave_period').then(r => r.json())
    ]);
    const W = w.status === 'fulfilled' && w.value.hourly ? w.value.hourly : null, Mh = m.status === 'fulfilled' && m.value.hourly ? m.value.hourly : null;
    if (!W && !Mh) throw new Error('sin datos');
    const times = (W || Mh).time, rows = [];
    const nowH = new Date(); nowH.setMinutes(0, 0, 0);
    times.forEach((t, i) => {
      const d = new Date(t);
      if (d < nowH - 3600000 || d.getHours() % 3) return;
      rows.push({t, ws: W ? W.wind_speed_10m[i] : null, wd: W ? W.wind_direction_10m[i] : null, wg: W ? W.wind_gusts_10m[i] : null,
        h: Mh ? Mh.wave_height[Mh.time.indexOf(t)] : null, hd: Mh ? Mh.wave_direction[Mh.time.indexOf(t)] : null, hp: Mh ? Mh.wave_period[Mh.time.indexOf(t)] : null});
    });
    const rec = {lat: p.lat, lon: p.lon, t: Date.now(), rows};
    saved = [rec].concat(saved.filter(s => rhumb(s, p).nm >= 6)).slice(0, 12);
    DB.set('fc', saved);
    if (box()) box().innerHTML = fcTable(rec) + '<p class="hint">Previsión de Open-Meteo (modelos meteorológicos y de oleaje). Viento a 10 m en nudos; la flecha indica hacia dónde sopla. Queda guardada para verla sin internet.</p>';
  } catch (err) {
    if (box()) box().innerHTML = near ? '<p class="hint warn">No se pudo descargar. Previsión guardada el ' + fmtDate(near.t) + '.</p>' + fcTable(near) : '<p class="empty">No se pudo descargar la previsión. Prueba otra vez.</p>';
  }
}
function fcTable(rec) {
  let day = '', h = '<table class="fc"><thead><tr><th>Hora</th><th>Viento</th><th>Racha</th><th>Ola</th><th>Periodo</th></tr></thead><tbody>';
  rec.rows.forEach(r => {
    const d = new Date(r.t), ds = d.toLocaleDateString('es-ES', {weekday: 'long', day: 'numeric', month: 'long'});
    if (ds !== day) { day = ds; h += '<tr><td class="d" colspan="5">' + ds.charAt(0).toUpperCase() + ds.slice(1) + '</td></tr>'; }
    const b = r.ws != null ? bft(r.ws) : null;
    h += '<tr><td>' + pad(d.getHours(), 2) + ':00</td>' +
      '<td>' + (r.ws != null ? '<span class="bft" style="background:' + BFTC[b] + '">F' + b + '</span> ' + ni(r.ws) + ' kn <span class="arr" style="transform:rotate(' + (r.wd + 180) + 'deg)">↑</span>' + card(r.wd) : '—') + '</td>' +
      '<td>' + (r.wg != null ? ni(r.wg) + ' kn' : '—') + '</td>' +
      '<td>' + (r.h != null ? nf(r.h, 1) + ' m <span class="arr" style="transform:rotate(' + (r.hd + 180) + 'deg)">↑</span>' + card(r.hd) : '—') + '</td>' +
      '<td>' + (r.hp != null ? ni(r.hp) + ' s' : '—') + '</td></tr>';
  });
  return h + '</tbody></table>';
}

/* ======================= Carta oficial del IHM: cómo pide las cuadrículas ======================= */
/* La caché WMTS del IHM puede contar las filas desde arriba (lo normal) o desde abajo. Se prueba una vez
   con una cuadrícula de Madrid y se usa la forma que responde; si ninguna responde, se usa su WMS. */
let IHM_MODE = 'std';
const IHM_REST = 'https://ideihm.covam.es/ihmcache/wmts/1.0.0/RasterENC/default/googlemapscompatible/';
function ihmUrl(z, x, y) {
  if (IHM_MODE === 'flip') return IHM_REST + z + '/' + ((1 << z) - 1 - y) + '/' + x + '.png';
  if (IHM_MODE === 'kvp') return 'https://ideihm.covam.es/ihmcache/wmts?SERVICE=WMTS&REQUEST=GetTile&VERSION=1.0.0&LAYER=RasterENC&STYLE=default&TILEMATRIXSET=googlemapscompatible&TILEMATRIX=' + z + '&TILEROW=' + y + '&TILECOL=' + x + '&FORMAT=image/png';
  if (IHM_MODE === 'wms') return wmsUrl(z <= 12 ? 'cartaENCp3' : 'cartaENCp4', z <= 12 ? 'ENC_ES3' : 'ENC_ES4', z, x, y, false);
  return IHM_REST + z + '/' + y + '/' + x + '.png';
}
function resetLayer(id) { tiles.forEach((t, k) => { if (t.L.id === id) { if (t.img) t.img.src = ''; tiles.delete(k); } }); req(); }
function probeIhm() {
  if (S.set.ihmMode && S.set.ihmMode !== 'wms') { IHM_MODE = S.set.ihmMode; return; }
  if (!navigator.onLine) return;
  const one = url => new Promise(res => {
    const i = new Image();
    const t = setTimeout(() => res(false), 15000);
    i.onload = () => { clearTimeout(t); res(i.naturalWidth > 0); };
    i.onerror = () => { clearTimeout(t); res(false); };
    i.src = url;
  });
  const z = 7, x = 62, y = 48;
  Promise.all([
    one(IHM_REST + z + '/' + y + '/' + x + '.png'),
    one(IHM_REST + z + '/' + ((1 << z) - 1 - y) + '/' + x + '.png'),
    one('https://ideihm.covam.es/ihmcache/wmts?SERVICE=WMTS&REQUEST=GetTile&VERSION=1.0.0&LAYER=RasterENC&STYLE=default&TILEMATRIXSET=googlemapscompatible&TILEMATRIX=' + z + '&TILEROW=' + y + '&TILECOL=' + x + '&FORMAT=image/png')
  ]).then(([a, b, c]) => {
    const m = a ? 'std' : b ? 'flip' : c ? 'kvp' : 'wms';
    if (m !== IHM_MODE) { IHM_MODE = m; resetLayer('ihm'); }
    S.set.ihmMode = m; save('set');
  });
}

  const old = ((await DB.get('qa')) || []).filter(q => rhumb(q, p).m < 300).sort((a, b) => b.t - a.t)[0];

  if (!navigator.onLine) {
    if (old) {
      if (alive()) $('#qaState').textContent = 'Sin internet. Datos consultados aquí el ' + fmtDate(old.t) + ':';
      ['depth', 'hazard', 'bottom', 'zone', 'name', 'sea', 'wiki'].forEach(k => show(k, old[k], k === 'hazard' ? 'warn' : ''));
    } else if (alive()) $('#qaState').textContent = 'Sin internet y sin consultas guardadas en este punto. Con internet se guarda todo lo que salga aquí para verlo luego sin conexión.';
    tidesNear(p, 1).then(r => { const d = r.days[0] && r.days[0].rows; if (d && d.length) show('tide', [r.st.name + ': ' + d.map(x => (/pleamar|alta|high/i.test(x.t) ? 'pleamar ' : 'bajamar ') + x.h + (isFinite(x.a) ? ' (' + nf(x.a, 2) + ' m)' : '')).join(' · ')]); }).catch(() => {});
    return;
  }

  /* 2. Con internet: todo a la vez, cada fuente por su lado */
  const jobs = [
    depthInfo(p).then(d => { const t = depthText(d); if (t) { show('depth', [t + ' — EMODnet']); keep('depth', [t + ' — EMODnet']); } }),
    encAt(p).then(f => {
      const R = encSummary(f);
      show('depth', R.depth, '', true); keep('depth', R.depth);
      show('hazard', R.hazard, 'warn', true); keep('hazard', R.hazard);
      show('bottom', R.bottom, '', true); keep('bottom', R.bottom);
      show('zone', R.zone); keep('zone', R.zone);
      show('name', R.name); keep('name', R.name);
      if (R.other.length) { show('near', R.other.map(t => 'Carta oficial: ' + t)); }
      if (!f.length && alive()) show('depth', ['La carta oficial no tiene objetos justo en este punto.']);
    }, () => { if (alive()) show('depth', ['No se han podido leer ahora los datos de la carta oficial. Mantén el dedo en el punto y pulsa «Carta oficial aquí» para verlos.']); }),
    seabedAt(p).then(s => { if (s) { const t = 'Fondo de ' + s + ' — mapa europeo EMODnet (aproximado)'; show('bottom', [t]); keep('bottom', [t]); } }),
    osmAt(p).then(o => {
      const R = osmLines(o, p);
      const knownIds = new Set(near.map(x => x.id));
      const hz = R.hazard.filter(x => !x.id || !knownIds.has(x.id)), nr = R.near.filter(x => !x.id || !knownIds.has(x.id));
      show('hazard', hz, 'warn'); keep('hazard', hz.map(x => x.t));
      show('near', nr.slice(0, 8));
      show('zone', R.zone); keep('zone', R.zone);
      show('name', R.name); keep('name', R.name);
      req();
    }),
    placeName(p).then(n => { if (n) { show('name', [n]); keep('name', [n]); } }),
    seaNow(p).then(L => { if (L && L.length) { show('sea', L); keep('sea', L); } }),
    tidesNear(p, 1).then(r => {
      const d = r.days[0] && r.days[0].rows;
      if (d && d.length) show('tide', [r.st.name + ' (a ' + fmtDist(r.nm) + '): ' + d.map(x => (/pleamar|alta|high/i.test(x.t) ? 'pleamar ' : 'bajamar ') + x.h + (isFinite(x.a) ? ' (' + nf(x.a, 2) + ' m)' : '')).join(' · ')]);
    }),
    wikiNear(p).then(L => { const it = L.map(w => ({e: '📖', t: w.t + ' · a ' + fmtDist(w.d / NM), href: 'https://es.wikipedia.org/wiki/' + encodeURIComponent(w.t.replace(/ /g, '_'))})); show('wiki', it); keep('wiki', it.map(x => x.t)); })
  ].map(pr => Promise.race([pr.catch(() => null), sleep(16000)]));
  await Promise.all(jobs);
  if (!alive()) return;
  const got = Object.keys(data).filter(k => Array.isArray(data[k]) && data[k].length).length;
  $('#qaState').textContent = got ? 'Consultado ahora (' + hm(new Date()) + '). Queda guardado para verlo sin internet.' : 'Ninguna fuente ha respondido. Prueba otra vez en un momento.';
  if (got) {
    const list = ((await DB.get('qa')) || []).filter(q => rhumb(q, p).m >= 300);
    list.unshift(data);
    DB.set('qa', list.slice(0, 80));
  }
}

/* ======================= Profundidad a lo largo de una ruta (EMODnet) ======================= */
async function routeDepth(r) {
  if (!navigator.onLine) { toast('Necesitas internet para calcular la profundidad de la ruta', 'ko'); return; }
  toast('Calculando la profundidad de cada tramo…', 'info', 2500);
  const out = [];
  for (let i = 1; i < r.pts.length; i++) {
    const a = r.pts[i - 1], b = r.pts[i];
    try {
      const arr = await fetchJ('https://rest.emodnet-bathymetry.eu/depth_profile?geom=' + encodeURIComponent('LINESTRING(' + a.lon.toFixed(6) + ' ' + a.lat.toFixed(6) + ',' + b.lon.toFixed(6) + ' ' + b.lat.toFixed(6) + ')'), 15000);
      const vals = (Array.isArray(arr) ? arr : (arr && (arr.depths || arr.values || arr.profile)) || []).map(v => num(typeof v === 'object' && v ? (v.depth != null ? v.depth : v.avg != null ? v.avg : v.value) : v));
      const ok = vals.filter(v => v != null);
      out.push(ok.length ? {min: Math.min.apply(null, ok), max: Math.max.apply(null, ok), dry: ok.some(v => v <= 0) || vals.length > ok.length * 1.5} : null);
    } catch (e) { out.push(null); }
    await sleep(250);
  }
  r.prof = out; r.profT = Date.now();
  save('routes', 0);
  renderSheet();
  const safe = S.set.draft + S.set.margin, bad = out.filter(x => x && (x.dry || x.min < safe)).length;
  toast(bad ? '⚠ ' + bad + (bad === 1 ? ' tramo pasa' : ' tramos pasan') + ' por menos de ' + nf(safe, 1) + ' m o por tierra' : 'Profundidad de la ruta calculada', bad ? 'wa' : 'ok', 5000);
}

/* ======================= Comprobar desde el iPad que cada fuente responde ======================= */
function diagnose() {
  let c = centerLL();
  if (!(c.lat > 27 && c.lat < 44.5 && c.lon > -19 && c.lon < 5)) c = {lat: 36.53, lon: -6.30};
  const tileOf = z => { const n = 1 << z; return [z, Math.floor(lon2x(c.lon) * n), Math.floor(lat2y(c.lat) * n)]; };
  const imgs = [
    ['Carta náutica del IHM (zoom 13)', LAYERS.ihmw.url(...tileOf(13))],
    ['Carta náutica de puertos del IHM (zoom 15)', LAYERS.ihmw5.url(...tileOf(15))],
    ['Carta electrónica del IHM (zoom 13, modo ' + IHM_MODE + ')', LAYERS.ihm.url(...tileOf(13))],
    ['Sondas del IHM (zoom 14)', LAYERS.sond.url(...tileOf(14))],
    ['Batimétrica EMODnet (zoom 11)', LAYERS.emod.url(...tileOf(11))],
    ['Balizas OpenSeaMap (zoom 14)', LAYERS.sea.url(...tileOf(14))]
  ];
  const ua = navigator.userAgent.replace(/[^\x20-\x7E]/g, '');
  openModal('Comprobar las cartas', '<p class="hint">' + esc(fmtLL(c)) + ' · ' + (navigator.onLine ? 'con internet' : 'SIN internet') + ' · pantalla x' + (window.devicePixelRatio || 1) + '</p>' +
    '<div class="list">' + imgs.map((m, i) => '<div class="item"><div class="item-h"><img id="dgI' + i + '" alt="" style="width:96px;height:96px;border-radius:8px;border:1px solid var(--line);background:#fff;object-fit:cover;flex:none"><span class="t"><b>' + esc(m[0]) + '</b><small id="dgS' + i + '">Probando…</small></span></div></div>').join('') +
    ['Fichas de boyas (Overpass)', 'Mareas del IHM', 'Profundidad EMODnet', 'Datos de la carta oficial en un punto', 'Tipo de fondo (EMODnet)', 'Wikipedia cerca', 'El mar ahora (Open-Meteo)'].map((n, i) => '<div class="item"><div class="item-h"><span class="t"><b>' + n + '</b><small id="dgF' + i + '">Probando…</small></span></div></div>').join('') +
    '</div><p class="hint" style="word-break:break-all">' + esc(ua) + ' · versión ' + esc(String(window.APPV || '')) + '</p>');
  imgs.forEach((m, i) => {
    const el = $('#dgI' + i), st = $('#dgS' + i), t0 = performance.now();
    el.onload = () => { st.textContent = '✓ Carga (' + el.naturalWidth + ' px, ' + Math.round(performance.now() - t0) + ' ms)'; st.style.color = 'var(--ok)'; };
    el.onerror = () => { st.textContent = '✗ No carga'; st.style.color = 'var(--ko)'; };
    el.src = m[1];
  });
  const set = (i, ok, txt) => { const el = $('#dgF' + i); if (el) { el.textContent = (ok ? '✓ ' : '✗ ') + txt; el.style.color = ok ? 'var(--ok)' : 'var(--ko)'; } };
  overpass('[out:json][timeout:20];node(around:2000,' + c.lat.toFixed(4) + ',' + c.lon.toFixed(4) + ')["seamark:type"];out tags 5;')
    .then(j => set(0, true, (j.elements || []).length + ' señales cerca'), e => set(0, false, String(e && e.message || e)));
  fetch(TIDE + 'request=getlist&format=json').then(r => r.text()).then(t => set(1, t.length > 20, t.length + ' caracteres')).catch(e => set(1, false, String(e && e.message || e)));
  depthInfo(c).then(d => set(2, !!d, d ? depthText(d) + ' (' + d.src + ')' : 'sin respuesta'), e => set(2, false, String(e && e.message || e)));
  encAt(c).then(f => { const R = encSummary(f); set(3, true, f.length + ' objetos · ' + R.depth.concat(R.hazard, R.bottom).slice(0, 2).join(' · ')); }, e => set(3, false, String(e && e.message || e) + ' (seguramente el IHM no deja leerlos desde otras webs)'));
  seabedAt(c).then(t => set(4, !!t, t || 'sin dato'), e => set(4, false, String(e && e.message || e)));
  wikiNear(c).then(L => set(5, true, L.length + ' artículos'), e => set(5, false, String(e && e.message || e)));
  seaNow(c).then(L => set(6, !!L, L ? L.join(' · ') : 'sin respuesta'), e => set(6, false, String(e && e.message || e)));
  const errs = ERRS.slice(-8);
  if (errs.length) $('#mBody').insertAdjacentHTML('beforeend', '<div class="sec"><p class="lbl">Últimos errores de la app</p>' + errs.map(x => '<p class="hint" style="word-break:break-word;margin:0">' + esc(x) + '</p>').join('') + '</div>');
}

/* ======================= Descargas para usar sin conexión ======================= */
async function fetchTile(url) {
  let res;
  try { res = await fetch(url, {mode: 'cors', credentials: 'omit'}); }
  catch (e) { res = await fetch(url, {mode: 'no-cors', credentials: 'omit'}); }
  if (res.type === 'opaque') return res;
  if (res.status === 404 || res.status === 204) return null;
  if (!res.ok) throw new Error('HTTP ' + res.status);
  return res;
}
function startDownload() {
  const b = dlBBox(), layers = dlLayers(), c = countTiles(b, DLZMIN, S.dlZ, layers);
  if (!c.n || c.n > MAXT) return;
  const cen = {lat: (b.n + b.s) / 2, lon: (b.w + b.e) / 2}, port = nearestPort(cen, 40);
  const a = {id: uid(), name: 'Zona ' + (port ? port.name : fmtLat(cen.lat).replace(/,\d+/, '') + ' ' + fmtLon(cen.lon).replace(/,\d+/, '')), date: Date.now(), bbox: b, zmin: DLZMIN, zmax: S.dlZ, layers, total: c.n, done: 0, mb: 0, status: 'run'};
  S.areas.unshift(a); save('areas', 0);
  setMode(null);
  runDownload(a);
  openSheet('zonas');
}
let dlUiT = 0;
function dlUi(force) {
  const now = Date.now();
  if (!force && now - dlUiT < 300) return;
  dlUiT = now;
  const pc = DL.total ? Math.floor(DL.done / DL.total * 100) : 0;
  $('#bDlL').innerHTML = DL.running ? '<span class="pc">' + (DL.paused ? 'Pausa' : pc + ' %') + '</span>' : 'Descargar';
  const t = $('#dlTxt'), bar = $('#dlBar');
  if (t) t.textContent = ni(DL.done) + ' de ' + ni(DL.total) + ' · ' + pc + ' %' + (DL.err ? ' · ' + ni(DL.err) + ' fallos' : '');
  if (bar) bar.style.width = pc + '%';
}
async function runDownload(a) {
  if (DL.running) { toast('Ya hay una descarga en marcha', 'wa'); return; }
  if (!navigator.onLine) { toast('Necesitas internet para descargar', 'ko'); return; }
  try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch (e) { /* nada */ }
  Object.assign(DL, {running: true, paused: false, cancel: false, area: a, done: 0, total: 0, err: 0, bytes: 0});
  a.status = 'run'; save('areas', 0);
  wake(true);
  refreshSheet();
  const cache = await caches.open('mar-zona-' + a.id);
  const jobs = [];
  a.layers.forEach(id => {
    const L = LAYERS[id];
    for (let z = Math.max(a.zmin, L.min); z <= Math.min(a.zmax, L.max); z++) {
      const r = tileRange(a.bbox, z);
      for (let y = r.y0; y <= r.y1; y++) for (let x = r.x0; x <= r.x1; x++) jobs.push(L.url(z, x, y));
    }
  });
  DL.total = jobs.length; a.total = jobs.length;
  let i = 0, offStreak = 0;
  async function worker() {
    while (i < jobs.length && !DL.cancel) {
      if (DL.paused) { await sleep(400); continue; }
      if (!navigator.onLine) { await sleep(1500); if (++offStreak > 40) DL.cancel = true; continue; }
      offStreak = 0;
      const url = jobs[i++];
      let ok = false;
      for (let tr = 0; tr < 2 && !ok; tr++) {
        try {
          if (await cache.match(url)) { ok = true; break; }
          const res = await fetchTile(url);
          if (res) {
            const len = +res.headers.get('content-length') || 0;
            await cache.put(url, res);
            DL.bytes += len || (url.indexOf('openseamap') > 0 ? 3000 : 25000);
          }
          ok = true;
        } catch (e) { await sleep(500); }
      }
      if (!ok) DL.err++;
      DL.done++;
      dlUi();
    }
  }
  await Promise.all([worker(), worker(), worker(), worker()]);
  if (!DL.cancel && navigator.onLine) {
    $('#bDlL').innerHTML = '<span class="pc">Boyas…</span>';
    try { await smZone(a); } catch (e) { /* se pueden bajar luego */ }
    $('#bDlL').innerHTML = '<span class="pc">Mareas…</span>';
    try { const cen = {lat: (a.bbox.n + a.bbox.s) / 2, lon: (a.bbox.w + a.bbox.e) / 2}; const t = await tidesNear(cen, 15); a.tide = t.st.name; } catch (e) { /* sin mareas */ }
  }
  a.done = DL.done; a.mb = Math.max(a.mb || 0, DL.bytes / 1048576);
  a.status = (!DL.cancel && DL.done >= DL.total && DL.err < Math.max(5, DL.total * 0.02)) ? 'ok' : 'partial';
  const msg = DL.cancel ? 'Descarga parada. Puedes continuarla en el menú, en «Descargas».' : a.status === 'ok' ? '✓ ' + a.name + ' lista para usar sin conexión' : 'Descarga terminada con ' + ni(DL.err) + ' fallos. Pulsa «Continuar» para reintentar.';
  Object.assign(DL, {running: false, paused: false, cancel: false, area: null});
  save('areas', 0);
  if (!S.gps.on) wake(false);
  dlUi(true); refreshSheet();
  toast(msg, a.status === 'ok' ? 'ok' : 'wa', 5000);
}

/* ======================= GPX, copias y archivos ======================= */
const safeName = s => String(s).replace(/[\\/:*?"<>|]+/g, '-').slice(0, 60) || 'cartas';
const iso = t => new Date(t).toISOString();
function gpx(body) {
  return '<?xml version="1.0" encoding="UTF-8"?>\n<gpx version="1.1" creator="Cartas náuticas (Apps del taller)" xmlns="http://www.topografix.com/GPX/1/1">\n' + body + '\n</gpx>\n';
}
const f6 = v => (Math.round(v * 1e6) / 1e6).toString();
function gpxWpt(m) { return '<wpt lat="' + f6(m.lat) + '" lon="' + f6(m.lon) + '"><time>' + iso(m.date || Date.now()) + '</time><name>' + esc(m.name) + '</name>' + (m.note ? '<desc>' + esc(m.note) + '</desc>' : '') + '<sym>' + (MT[m.type] || MT.otro).sym + '</sym><type>' + esc(m.type) + '</type></wpt>'; }
function gpxRte(r) { return '<rte><name>' + esc(r.name) + '</name>' + r.pts.map((p, i) => '<rtept lat="' + f6(p.lat) + '" lon="' + f6(p.lon) + '"><name>' + esc(p.name || ('P' + (i + 1))) + '</name></rtept>').join('') + '</rte>'; }
function gpxTrk(t) { return '<trk><name>' + esc(t.name) + '</name><trkseg>' + t.pts.map(p => '<trkpt lat="' + f6(p[0]) + '" lon="' + f6(p[1]) + '"><time>' + iso(p[2]) + '</time></trkpt>').join('') + '</trkseg></trk>'; }
function shareFile(name, text, mime) {
  const blob = new Blob([text], {type: mime});
  try {
    const file = new File([blob], name, {type: mime});
    if (navigator.canShare && navigator.canShare({files: [file]}) && /iPad|iPhone|Macintosh/.test(navigator.userAgent) && 'ontouchend' in document) {
      navigator.share({files: [file], title: name}).catch(() => {});
      return;
    }
  } catch (e) { /* sigue con la descarga */ }
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 4000);
}
function simplify(pts, tolM) {
  if (pts.length < 3) return pts.slice();
  const k = Math.cos(rad(pts[0].lat)) * 111320, xy = pts.map(p => [p.lon * k, p.lat * 110574]);
  const keep = new Array(pts.length).fill(false);
  keep[0] = keep[pts.length - 1] = true;
  const st = [[0, pts.length - 1]];
  while (st.length) {
    const [a, b] = st.pop();
    let md = 0, mi = -1;
    const [ax, ay] = xy[a], [bx, by] = xy[b], L = Math.hypot(bx - ax, by - ay) || 1;
    for (let i = a + 1; i < b; i++) {
      const d = Math.abs((bx - ax) * (ay - xy[i][1]) - (ax - xy[i][0]) * (by - ay)) / L;
      if (d > md) { md = d; mi = i; }
    }
    if (md > tolM && mi > 0) { keep[mi] = true; st.push([a, mi], [mi, b]); }
  }
  return pts.filter((p, i) => keep[i]);
}
function kids(el, tag) { return Array.from(el.children).filter(c => c.localName === tag); }
function kidTxt(el, tag) { const c = kids(el, tag)[0]; return c ? c.textContent.trim() : ''; }
function importGpx(xml) {
  const doc = new DOMParser().parseFromString(xml, 'application/xml');
  if (doc.getElementsByTagName('parsererror').length) throw new Error('GPX no válido');
  const root = doc.documentElement;
  let nm = 0, nr = 0, nt = 0;
  kids(root, 'wpt').forEach(w => {
    const sym = kidTxt(w, 'sym'), ty = kidTxt(w, 'type');
    let type = MT[ty] ? ty : 'otro';
    if (!MT[ty]) for (const k in MT) if (MT[k].sym.toLowerCase() === sym.toLowerCase()) type = k;
    if (/fish/i.test(sym)) type = 'pesca'; else if (/anchor/i.test(sym) && type === 'otro') type = 'fondeo';
    S.marks.push({id: uid(), name: kidTxt(w, 'name') || 'Punto', type, lat: +w.getAttribute('lat'), lon: +w.getAttribute('lon'), note: kidTxt(w, 'desc') || kidTxt(w, 'cmt'), date: Date.parse(kidTxt(w, 'time')) || Date.now()});
    nm++;
  });
  kids(root, 'rte').forEach(r => {
    const pts = kids(r, 'rtept').map(p => ({lat: +p.getAttribute('lat'), lon: +p.getAttribute('lon'), name: kidTxt(p, 'name') || undefined}));
    if (pts.length > 1) { S.routes.push({id: uid(), name: kidTxt(r, 'name') || 'Ruta importada', pts, vis: true, date: Date.now()}); nr++; }
  });
  kids(root, 'trk').forEach(t => {
    const pts = [];
    let t0 = Date.now();
    kids(t, 'trkseg').forEach(sg => kids(sg, 'trkpt').forEach(p => { const tm = Date.parse(kidTxt(p, 'time')) || (t0 += 1000); pts.push([+p.getAttribute('lat'), +p.getAttribute('lon'), tm, 0]); }));
    if (pts.length > 1) { const tr = {id: uid(), name: kidTxt(t, 'name') || 'Rastro importado', date: pts[0][2], pts, vis: true}; tr.st = trackStats(tr); S.tracks.push(tr); nt++; }
  });
  return [nm, nr, nt];
}
function importJson(d) {
  if (!d || (d.app !== 'cartas-nauticas' && !d.marcas)) throw new Error('No es una copia de Cartas');
  let nm = 0, nr = 0, nt = 0;
  (d.marcas || []).forEach(m => { if (!byId(S.marks, m.id)) { S.marks.push(m); nm++; } });
  (d.rutas || []).forEach(r => { if (!byId(S.routes, r.id)) { S.routes.push(r); nr++; } });
  (d.rastros || []).forEach(t => { if (!byId(S.tracks, t.id)) { S.tracks.push(t); nt++; } });
  return [nm, nr, nt];
}
$('#fileIn').addEventListener('change', async e => {
  const f = e.target.files && e.target.files[0];
  if (!f) return;
  try {
    const txt = await f.text();
    const n = /^\s*</.test(txt) ? importGpx(txt) : importJson(JSON.parse(txt));
    save('marks', 0); save('routes', 0); save('tracks', 0);
    refreshSheet(); req();
    toast('Cargado: ' + n[0] + ' marcas, ' + n[1] + ' rutas y ' + n[2] + ' rastros');
  } catch (err) { toast('No se pudo leer el archivo: ' + err.message, 'ko', 6000); }
});

/* ======================= Botones fijos ======================= */
$('#bZin').onclick = () => zoomAnim(M.w / 2, M.h / 2, 1);
$('#bZout').onclick = () => zoomAnim(M.w / 2, M.h / 2, -1);
$('#bGps').onclick = () => {
  if (!S.gps.on) { gpsStart(true); return; }
  S.gps.follow = true; gpsBtn();
  if (S.gps.fix) animateTo(S.gps.fix.lat, S.gps.fix.lon, M.z < 12 ? 13 : Math.round(M.z), 450);
  else toast('Buscando tu posición…', 'info', 2500);
};
$('#bLayers').onclick = () => { if (!$('#sheet').hidden && S.tab === 'capas') closeSheet(); else openSheet('capas'); };
$('#bMenu').onclick = () => { if (!$('#sheet').hidden && S.tab !== 'capas') closeSheet(); else openSheet(S.tab === 'capas' ? 'marcas' : S.tab); };
$('#bSheetX').onclick = closeSheet;
$('#bNight').onclick = () => { S.set.night = !S.set.night; settingsChanged(); refreshSheet(); };
$('#bSearch').onclick = openSearch;
$('#bQa').onclick = () => whatsHere(centerLL());
$('#coords').onclick = openSearch;
function netUi() { $('#offline').hidden = navigator.onLine !== false; if (S.mode === 'download') { const t = $('#mbT'); if (t) t.dataset.k = ''; updateModebar(); } }
window.addEventListener('online', () => { netUi(); if (!S.set.ihmMode || S.set.ihmMode === 'wms') probeIhm(); tiles.forEach(t => { if (t.st === 3) { t.st = 0; t.tries = 0; } }); req(); });
window.addEventListener('offline', netUi);
window.addEventListener('resize', () => { resize(); document.body.classList.toggle('sheet-wide', !$('#sheet').hidden && window.innerWidth >= 820); });

/* ======================= Arranque ======================= */
if ('serviceWorker' in navigator) {
  const hadCtl = !!navigator.serviceWorker.controller;
  let reloaded = false;
  navigator.serviceWorker.addEventListener('controllerchange', () => {
    if (!hadCtl || reloaded) return;
    reloaded = true;
    flush();
    setTimeout(() => location.reload(), 150);
  });
}
async function init() {
  resize();
  setCenter(39.4, -3.6, window.innerWidth < 700 ? 5 : 6);
  const [set, view, marks, routes, tracks, areas, nav, rec] = await Promise.all(['set', 'view', 'marks', 'routes', 'tracks', 'areas', 'nav', 'rec'].map(k => DB.get(k)));
  if (set) S.set = Object.assign({}, DEF, set);
  if (!S.set.v || S.set.v < 3) { S.set.base = 'ihmw'; S.set.sea = false; S.set.sond = true; S.set.v = 3; save('set'); }
  if (Array.isArray(marks)) S.marks = marks;
  if (Array.isArray(routes)) S.routes = routes;
  if (Array.isArray(tracks)) S.tracks = tracks;
  if (Array.isArray(areas)) S.areas = areas.map(a => (a.status === 'run' ? Object.assign(a, {status: 'partial'}) : a));
  if (nav && (nav.type === 'point' || byId(S.routes, nav.id))) S.nav = nav;
  if (view && isFinite(view.lat)) setCenter(view.lat, view.lon, Math.round(view.z));
  if (rec && rec.pts && rec.pts.length > 1) {
    const t = {id: rec.id, name: 'Rastro ' + fmtDate(rec.start), date: rec.start, pts: rec.pts, vis: true};
    t.st = trackStats(t);
    if (!byId(S.tracks, t.id)) { S.tracks.unshift(t); save('tracks'); }
    DB.set('rec', null);
    toast('Se ha recuperado el rastro que se estaba grabando', 'info', 5000);
  }
  if (S.set.ihmMode && S.set.ihmMode !== 'wms') IHM_MODE = S.set.ihmMode;
  applySettings(); netUi(); renderNav(); recUi(); req();
  probeIhm();
  smLoad().then(() => req());
  if (!S.set.warned) {
    openModal('Antes de empezar',
      '<p style="margin:0">Esta app te enseña la carta náutica del Instituto Hidrográfico de la Marina, con boyas, faros, sondas y peligros, más la profundidad de EMODnet y las fichas de OpenSeaMap. Funciona sin internet en las zonas que descargues.</p>' +
      '<p class="hint warn">El IHM publica estas cartas como no válidas para la navegación: pueden no estar al día. Úsala como apoyo, junto a las cartas oficiales actualizadas y tus equipos de a bordo.</p>' +
      '<p class="hint">Mantén el dedo sobre la carta para ver un punto, ponerle una marca o ir hasta él. Pulsa «Descargar» para guardar tu zona antes de salir.</p>',
      [{label: 'Entendido', cls: 'pri', fn: () => { S.set.warned = true; save('set'); }}]);
  }
}
init();
})();
